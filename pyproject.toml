# pyproject.toml — Python project metadata + tool config.
#
# YTArchiver is shipped as a PyInstaller-bundled exe, not as a pip
# package, so this file exists for tooling and discoverability rather
# than `pip install .`. Notable consumers:
#   - Ruff, pytest, and Coverage read their settings below.
#   - IDEs (VS Code, PyCharm) read this for the Python version and
#     dependency list when populating their analysis.
#
# DO NOT add a build-system section unless you actually want to make
# YTArchiver pip-installable — the app is launched via main.py, not
# imported as a package.

[project]
name = "ytarchiver"
# backend/version.py is the one and only version source. This repository is
# not built as a wheel, so no packaging backend needs to materialize the
# dynamic field.
dynamic = ["version"]
description = "Subscription-based YouTube channel archiver with local Whisper transcription, FTS5 transcript search, and a pywebview UI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.13.*"
authors = [{ name = "skurbee" }]
keywords = ["youtube", "archive", "yt-dlp", "whisper", "transcription", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "pywebview==6.2.1",
    "pystray==0.19.5",
    "Pillow==12.2.0",
    "psutil==7.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]
dev = ["coverage==7.16.0", "pytest==9.0.3", "ruff==0.15.13"]

[project.urls]
Homepage = "https://github.com/skurbee/YTArchiver"
Repository = "https://github.com/skurbee/YTArchiver"
Changelog = "https://github.com/skurbee/YTArchiver/blob/main/docs/CHANGELOG.md"

# Full transitive versions and Windows artifact hashes live under
# requirements/. pyproject lists only the human-facing direct dependencies.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["backend"]
# A few frontend-only Python harnesses intentionally execute Node without
# importing backend code. Per-file isolation makes that expected; the combined
# report still fails naturally if no coverage data exists at all.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
# Match Python 3.13 (the build interpreter).
target-version = "py313"
line-length = 100

# Don't touch frozen / vendored / separate-clone dirs.
extend-exclude = [
    "Classic Tkinter ver",
    "GitHub Desktop",
]

[tool.ruff.lint]
# Sensible default rules + a few hand-picked extras.
# - E,W: pycodestyle errors + warnings
# - F:   pyflakes (undefined names, unused imports, F401 star imports)
# - I:   isort (import order)
# - B:   bugbear (likely bugs)
# - UP:  pyupgrade (modern syntax suggestions)
# - C4:  comprehensions (cleaner list/dict comp)
# - PIE: misc lints (Pie)
select = ["E", "W", "F", "I", "B", "UP", "C4", "PIE"]

# Allow long lines in comments + docstrings — the patch-history comments
# scattered through the codebase aren't worth a reflow pass.
ignore = [
    "E501",   # line-too-long: operational rationale and URLs are preserved
    "E731",   # lambda-assignment: we use lambdas as ad-hoc helpers
    "E741",   # ambiguous-variable-name (l, I, O): legacy code uses these
    "E402",   # module-import-not-at-top: deliberate lazy/conditional imports
    "E701",   # one-line `try: ... except:` (colon-compound) is house style
    "E702",   # one-line semicolon-compound statements: same house style
    "B007",   # unused loop control variable: common style here
    "B008",   # function-call-in-default-argument: deliberate for some helpers
    "B024",   # abstract-base-class-without-abstract-method: not our pattern
    "B904",   # raise-without-from-inside-except: most exception handling is at boundary
    "UP015",  # redundant-open-modes: harmless and explicit
    "UP032",  # f-string: many .format() calls are intentional for clarity
]

# Star imports are intentional in backend/{sync,transcribe,metadata}/__init__.py
# (they're the re-export shims that surface each core.py's __all__).
# _shared.py is the star-import source for the mixin package; it suppresses
# its own F401/F403 so the noqa comments on each re-export line stay clean.
[tool.ruff.lint.per-file-ignores]
"backend/sync/__init__.py" = ["F401", "F403"]
"backend/transcribe/__init__.py" = ["F401", "F403"]
"backend/metadata/__init__.py" = ["F401", "F403"]
"backend/api_mixins/_shared.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
