# pyproject.toml — Python project metadata + tool config.
#
# YTArchiver is shipped as a PyInstaller-bundled exe, not as a pip
# package, so this file exists for tooling and discoverability rather
# than `pip install .`. Notable consumers:
#   - ruff reads `[tool.ruff]` here when no top-level `ruff.toml` is
#     present. We keep `ruff.toml` for now (it's already configured);
#     this file just declares the project shape for other tools.
#   - IDEs (VS Code, PyCharm) read this for the Python version and
#     dependency list when populating their analysis.
#
# DO NOT add a build-system section unless you actually want to make
# YTArchiver pip-installable — the app is launched via main.py, not
# imported as a package.

[project]
name = "ytarchiver"
# backend/version.py is the one and only version source. This repository is
# not built as a wheel, so no packaging backend needs to materialize the
# dynamic field.
dynamic = ["version"]
description = "Subscription-based YouTube channel archiver with local Whisper transcription, FTS5 transcript search, and a pywebview UI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.13.*"
authors = [{ name = "skurbee" }]
keywords = ["youtube", "archive", "yt-dlp", "whisper", "transcription", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "pywebview==6.2.1",
    "pystray==0.19.5",
    "Pillow==12.2.0",
    "psutil==7.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]
dev = ["coverage==7.16.0", "pytest==9.0.3", "ruff==0.15.13"]

[project.urls]
Homepage = "https://github.com/skurbee/YTArchiver"
Repository = "https://github.com/skurbee/YTArchiver"
Changelog = "https://github.com/skurbee/YTArchiver/blob/main/docs/CHANGELOG.md"

# Full transitive versions and Windows artifact hashes live under
# requirements/. pyproject lists only the human-facing direct dependencies.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["backend"]
# A few frontend-only Python harnesses intentionally execute Node without
# importing backend code. Per-file isolation makes that expected; the combined
# report still fails naturally if no coverage data exists at all.
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
show_missing = true
skip_covered = false
