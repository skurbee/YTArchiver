  <!-- Download tab -->
  <div class="tab-panel active" id="panel-download">

    <div class="controls-area">
      <div class="download-entry-row">
      <div class="download-url-row">
        <input type="text" class="ctl-input" id="url-input"
               autocomplete="off" spellcheck="false" autocapitalize="none"
               aria-label="Video URL" aria-describedby="url-error-text"
               placeholder="Paste a YouTube video URL" />
        <button class="btn download-single" id="btn-download-single"
                title="Download the video from the URL" hidden disabled>
          <svg class="btn-ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M7 1h2v7l2.5-2.5L13 7l-5 5-5-5 1.5-1.5L7 8V1zM2 11h2v3h8v-3h2v4H2v-4z"/>
          </svg>
          <span>Download</span>
        </button>
      </div>
      <span class="status-text" id="last-full-sync">Last Full Sync: &mdash;</span>
      </div>
      <div class="url-error-row" id="url-error-row" hidden>
        <span class="url-error-text" id="url-error-text" role="status"></span>
      </div>

      <div class="download-details">
      <fieldset class="video-opts-panel" id="video-opts-panel" hidden>
        <legend>Video options</legend>
        <div class="vo-fields">
          <div class="vo-form-row">
            <label class="vo-form-label" for="vo-save-to">Save to</label>
            <input type="text" class="vo-input" id="vo-save-to"
                   placeholder="(use default download folder)" />
            <button class="btn btn-thin" id="vo-save-to-browse">Browse</button>
          </div>
          <div class="vo-form-row">
            <label class="vo-form-label" for="vo-resolution">Resolution</label>
            <select class="vo-select" id="vo-resolution">
              <option value="best">Best available</option>
              <option value="2160">2160p (4K)</option>
              <option value="1440">1440p</option>
              <option value="1080" selected>1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
            </select>
          </div>
          <div class="vo-form-row">
            <span class="vo-form-label" id="vo-filename-label">Filename</span>
            <div class="vo-field-controls" role="group" aria-labelledby="vo-filename-label">
              <label class="vo-check">
                <input type="checkbox" id="vo-use-yt-title" checked />
                <span>Use video title</span>
              </label>
              <input type="text" class="vo-input vo-custom-name" id="vo-custom-name"
                     placeholder="Custom filename" aria-label="Custom filename" disabled />
            </div>
          </div>
          <div class="vo-form-row">
            <span class="vo-form-label" id="vo-dates-label">Dates</span>
            <div class="vo-field-controls" role="group" aria-labelledby="vo-dates-label">
              <label class="vo-check">
                <input type="checkbox" id="vo-date-file" checked />
                <span>Use upload date for file date</span>
              </label>
              <label class="vo-check">
                <input type="checkbox" id="vo-add-date" />
                <span>Add date to filename</span>
              </label>
            </div>
          </div>
          <div class="vo-form-row">
            <span class="vo-form-label" id="vo-processing-label">Processing</span>
            <div class="vo-field-controls" role="group" aria-labelledby="vo-processing-label">
              <label class="vo-check"
                     title="Create a transcript after download using the current transcription settings.">
                <input type="checkbox" id="vo-transcribe" checked />
                <span>Transcribe video</span>
              </label>
              <label class="vo-check"
                     title="Also save the video's thumbnail and description so they appear in Browse and Watch. Support files stay hidden.">
                <input type="checkbox" id="vo-grab-metadata" checked />
                <span>Metadata &amp; thumbnail</span>
              </label>
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset class="video-opts-panel" id="manual-download-jobs" hidden>
        <legend>Active downloads</legend>
        <div id="manual-download-list" aria-live="polite"></div>
      </fieldset>

      <!-- Channel nudge: when a channel URL is pasted but not in subs, show
           a handoff button to pre-populate the shared Add-Channel form.
           Mirrors YTArchiver.py:4458 channel_nudge_panel. -->
      <div class="channel-nudge-panel" id="channel-nudge-panel" hidden>
        <span class="channel-nudge-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="m10 9 5 3-5 3V9Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="channel-nudge-copy">
          <strong class="channel-nudge-title">Channel link detected</strong>
          <span class="channel-nudge-description">Add channels in the Browse tab.</span>
        </span>
        <button class="btn btn-thin" id="btn-channel-nudge-add">
          <svg class="btn-ico" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Add this channel</span>
        </button>
      </div>
      </div>

      <div class="download-sync-row">
        <div class="download-sync-actions">
          <button class="btn btn-sync" id="btn-sync-subbed"
                data-needs-ready disabled
                title="Download all subscribed channels (available after startup)">
          <svg class="btn-ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M3 2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H3zm1 2h8v1H4V4zm0 3h8v1H4V7zm0 3h5v1H4v-1z"/>
          </svg>
          <span>Sync subscriptions</span>
        </button>
          <button class="btn btn-pause" id="btn-pause"
                title="Pause all queues (current jobs finish first)"
                aria-label="Pause all queues">
          <svg class="btn-ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <rect x="4" y="3" width="3" height="10" rx="0.5"/>
            <rect x="9" y="3" width="3" height="10" rx="0.5"/>
          </svg>
          <span class="pause-label">Pause all</span>
        </button>
        </div>
        <div class="download-schedule controls-row-thin">
          <label class="ctl-label ctl-label-thin" for="auto-sync-select"
               title="Run Sync subscriptions automatically on an interval">Auto-sync:</label>
        <select class="ctl-select" id="auto-sync-select"
                title="How often to auto-run Sync subscriptions">
          <option value="Off">Off</option>
          <option value="30 min">30 minutes</option>
          <option value="1 hr">1 hour</option>
          <option value="2 hr">2 hours</option>
          <option value="4 hr">4 hours</option>
          <option value="6 hr">6 hours</option>
          <option value="12 hr" data-featured="clock time">12 hours</option>
          <option value="24 hr" data-featured="clock time">24 hours</option>
          <option value="When budget allows"
                  data-tooltip="Waits until your rolling YouTube traffic budget can fit one complete sync, then runs it automatically. It never starts a partial sync.">When budget allows</option>
        </select>

        <span class="autorun-clock-time" id="autorun-clock-time-wrap" hidden>
          <span class="autorun-clock-time-prefix">at</span>
          <select class="ctl-select" id="auto-sync-clock-time"
                  aria-label="Auto-sync clock time"></select>
        </span>

        <span class="status-text autorun-countdown" id="autorun-countdown"
              role="status" aria-live="polite" aria-atomic="true"></span>
        </div>
      </div>

      <!-- The footer mirrors startup progress from this retained target. -->
      <span class="startup-indicator-stack" id="startup-indicator-stack"
            role="status" aria-live="polite" aria-atomic="true">
        <span id="startup-indicator-slot-sweep" class="startup-indicator" hidden></span>
      </span>
    </div>

    <!-- Deferred livestreams drawer &mdash; hidden until there's at least one -->
    <div class="deferred-livestreams" id="deferred-livestreams" hidden>
      <div class="deferred-head">
        <span class="deferred-label">Deferred livestreams</span>
        <span class="deferred-hint">(will auto-retry on next sync)</span>
        <div class="spacer"></div>
        <span class="status-text" id="deferred-count">0</span>
        <!-- Retry dropdown: Now kicks an immediate sync; 24h / 1 week
             snooze the drawer so it stops nagging until that time. -->
        <div class="deferred-retry-wrap">
          <button class="btn btn-ghost btn-thin" id="btn-deferred-retry"
                   title="Sync or reminder options" aria-haspopup="menu"
                   aria-controls="deferred-retry-menu" aria-expanded="false">Options &#x25BE;</button>
          <div class="deferred-retry-menu" id="deferred-retry-menu" role="menu" hidden>
            <button data-retry="now" role="menuitem">Sync Subbed now</button>
            <button data-retry="24h" role="menuitem">Remind me in 24 hours</button>
            <button data-retry="1w" role="menuitem">Remind me in 1 week</button>
          </div>
        </div>
        <button class="btn btn-ghost btn-thin" id="btn-deferred-clear"
                title="Forget every deferred livestream">Clear</button>
      </div>
      <div class="deferred-list" id="deferred-list"></div>
    </div>

    <div class="download-log-tools">
      <button class="btn btn-ghost btn-thin download-clear" id="btn-clear-menu"
                title="Clear log or activity history"><span class="clear-menu-label">Clear</span> <span class="clear-menu-caret">&#9662;</span></button>
    </div>

    <!-- Paned log area -->
    <div class="log-paned" id="log-paned">
      <div class="activity-log-frame" hidden>
        <div class="activity-log" id="activity-log" tabindex="-1"></div>
      </div>
      <div class="paned-splitter" id="paned-splitter" role="separator"
           aria-orientation="horizontal" aria-label="Resize activity log"
           tabindex="0" hidden></div>
      <div class="main-log-frame">
        <div class="main-log" id="main-log" tabindex="-1"></div>
      </div>
    </div>

  </div>
